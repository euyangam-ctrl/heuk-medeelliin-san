<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ХЭҮК мэдээллийн сан</title>
<meta name="description" content="Хүний эрхийн Үндэсний Комиссын санал, зөвлөмж, шаардлага, хууль тогтоомжийн төсөлд өгсөн санал, судалгаа, илтгэлийн нэгдсэн сан">
<meta name="theme-color" content="#2350C2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ХЭҮК сан">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232350C2'/%3E%3Cpath d='M18 44V20h7v9.5h14V20h7v24h-7v-9h-14v9z' fill='%23fff'/%3E%3C/svg%3E">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Unbounded:wght@500;700&amp;display=swap" rel="stylesheet">
<style id="app-css">
/* Layout: a quiet left rail, a ledger-like content column, bottom tabs on phones; overlays for the document reader and edit sheets */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EBEEF3; --line:#DCE1E9; --line-2:#C7CEDA;
  --ink:#111A2C; --ink-2:#465166; --ink-3:#737D92;
  --accent:#2350C2; --accent-2:#1A3F9E; --accent-soft:#E3EAFA; --on-accent:#FFFFFF;
  --ok:#15784B; --ok-soft:#DBF1E5; --warn:#975A06; --warn-soft:#FAEDD5; --bad:#B42318; --bad-soft:#FAE2DE; --wait:#5A6476; --wait-soft:#E6E9EE;
  --t-zov:#2F5BD3; --t-sha:#8E3E9B; --t-san:#0B7F80; --t-gis:#C24E7F; --t-huu:#24406F; --t-sud:#8A6526; --t-ilt:#3A88B5;
  --t-x1:#5E6AD2; --t-x2:#4E8A3E; --t-x3:#B05A3C; --t-dun:#6B5BBF;
  --paper:#FFFFFF; --scrim:rgba(14,20,34,.42);
  --shadow:0 1px 2px rgba(17,26,44,.05),0 10px 30px rgba(17,26,44,.10);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D121D; --surface:#151C2B; --sunk:#1A2233; --line:#263046; --line-2:#344059;
  --ink:#E8EDF6; --ink-2:#AAB4C7; --ink-3:#7D889E;
  --accent:#7FA3FF; --accent-2:#A9C1FF; --accent-soft:#1D2A4A; --on-accent:#0D121D;
  --ok:#52C78F; --ok-soft:#12301F; --warn:#EEB25A; --warn-soft:#382811; --bad:#F2806F; --bad-soft:#3A1B16; --wait:#9BA5B7; --wait-soft:#232B3B;
  --t-zov:#7C9BFF; --t-sha:#C98AD6; --t-san:#4FC2C2; --t-gis:#E78DB2; --t-huu:#93ACDC; --t-sud:#D3AF6B; --t-ilt:#7CC2E8;
  --t-x1:#9AA3F0; --t-x2:#8CC77B; --t-x3:#E39477; --t-dun:#ABA0F2;
  --paper:#FFFFFF; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D121D; --surface:#151C2B; --sunk:#1A2233; --line:#263046; --line-2:#344059;
  --ink:#E8EDF6; --ink-2:#AAB4C7; --ink-3:#7D889E;
  --accent:#7FA3FF; --accent-2:#A9C1FF; --accent-soft:#1D2A4A; --on-accent:#0D121D;
  --ok:#52C78F; --ok-soft:#12301F; --warn:#EEB25A; --warn-soft:#382811; --bad:#F2806F; --bad-soft:#3A1B16; --wait:#9BA5B7; --wait-soft:#232B3B;
  --t-zov:#7C9BFF; --t-sha:#C98AD6; --t-san:#4FC2C2; --t-gis:#E78DB2; --t-huu:#93ACDC; --t-sud:#D3AF6B; --t-ilt:#7CC2E8;
  --t-x1:#9AA3F0; --t-x2:#8CC77B; --t-x3:#E39477; --t-dun:#ABA0F2;
  --paper:#FFFFFF; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.brand-mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.02em}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text b{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.01em}
.brand-text span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.main{min-width:0;width:100%;max-width:1200px;margin:0 auto;padding-block:20px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--ink-3);font-size:11px;font-weight:500}
.tab[aria-current="page"]{color:var(--accent)}
.tab svg{width:22px;height:22px}
@media (min-width:960px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .topbar,.tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .main{padding-block:32px 96px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px))}
}
.rail nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-weight:500;text-align:left}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{flex:none;width:19px;height:19px}
.nav kbd{margin-left:auto}
kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--ink-3)}

/* save state chip */
.savechip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:99px;background:var(--sunk);color:var(--ink-2);width:max-content}
.savechip i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.savechip[data-s="saved"] i{background:var(--ok)}
.savechip[data-s="dirty"] i,.savechip[data-s="saving"] i{background:var(--warn)}
.savechip[data-s="error"] i{background:var(--bad)}

/* page head */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,3.2vw,30px);line-height:1.15;letter-spacing:-.01em;margin-top:6px}
.sub{color:var(--ink-2);margin-top:6px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:3px 10px}

/* search hero */
.search{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:0 14px;min-height:54px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:14px 0}
.search .hint{font-size:12px;color:var(--ink-3);white-space:nowrap}
.search:focus-within{border-color:var(--accent)}
@media (max-width:600px){ .search .hint{display:none} }
.search-note{font-size:12.5px;color:var(--ink-3);margin-top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.btn .count{font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 7px;line-height:18px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

/* sections */
.stack{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.panel-h h2{font-size:16px;font-weight:600}
.panel-h p{margin:0;font-size:13px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:900px){ .grid2{grid-template-columns:1fr 1fr} }

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1100px){ .kpis{grid-template-columns:repeat(5,minmax(0,1fr))} }
.kpi{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;transition:border-color .15s}
.kpi:hover{border-color:var(--accent)}
.kpi .k-l{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);font-weight:500}
.kpi .k-l i{width:8px;height:8px;border-radius:3px;background:var(--c,var(--accent))}
.kpi .k-v{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k-s{font-size:12.5px;color:var(--ink-3)}
.kpis .kpi:first-child{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kpis .kpi:first-child .k-l,.kpis .kpi:first-child .k-s{color:inherit;opacity:.85}
.kpis .kpi:first-child .k-l i{background:var(--on-accent)}
@media (max-width:699px){ .kpis .kpi:first-child{grid-column:1 / -1} }

/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;max-width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{cursor:pointer}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.45;min-width:150px;box-shadow:var(--shadow)}
.tip b{font-size:13px}
.tip .tr{display:flex;align-items:center;gap:7px}
.tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .tr span{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.lg i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.lg[aria-pressed="false"]{opacity:.45}
.lg[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.selyear{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
select.inp,input.inp,textarea.inp{width:100%;min-height:40px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:8px 11px;font-size:14px}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.selyear select{width:auto}

/* status bars */
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.sbar i{display:block;height:100%}
.sbar .ok{background:var(--ok)} .sbar .warn{background:var(--warn)} .sbar .bad{background:var(--bad)} .sbar .wait{background:var(--wait)} .sbar .info{background:var(--accent)} .sbar .na{background:var(--line-2)}
.slist{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.sitem{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;text-align:left;font-size:14px}
.sitem:hover{background:var(--sunk)}
.sitem .lab{flex:1;min-width:0}
.sitem .n{font-variant-numeric:tabular-nums;font-weight:600}
.sitem .pc{font-variant-numeric:tabular-nums;color:var(--ink-3);width:44px;text-align:right;font-size:13px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;border-radius:99px;padding:3px 10px 3px 7px;white-space:nowrap;line-height:1.35}
.pill svg{width:13px;height:13px;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.na{background:var(--sunk);color:var(--ink-2)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}

/* bars list */
.blist{display:flex;flex-direction:column;gap:4px}
.bitem{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:4px 10px;align-items:center;text-align:left;padding:7px 8px;border-radius:9px;font-size:14px}
.bitem:hover{background:var(--sunk)}
.bitem .bt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .bn{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bitem .bb{grid-column:1 / -1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bitem .bb i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* pivot */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);max-height:520px}
table.pivot{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.pivot th,.pivot td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.pivot thead th{position:sticky;top:0;z-index:2;background:var(--sunk);font-weight:600;color:var(--ink-2);font-size:12.5px;vertical-align:bottom;white-space:normal;min-width:84px;line-height:1.3}
.pivot th:first-child,.pivot td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:var(--surface);font-weight:600}
.pivot thead th:first-child{z-index:3;background:var(--sunk)}
.pivot tfoot td{position:sticky;bottom:0;background:var(--sunk);font-weight:700;border-top:1px solid var(--line-2)}
.pivot tfoot td:first-child{background:var(--sunk)}
.pivot td.tot{font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pivot td.z{color:var(--ink-3);opacity:.6}
.pivot button{color:inherit;font-variant-numeric:tabular-nums;padding:1px 4px;border-radius:5px}
.pivot button:hover{background:var(--accent-soft);color:var(--accent)}
.pivot .hd{display:inline-flex;align-items:center;gap:6px}

/* docs list */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .search{flex:1 1 320px;box-shadow:none;min-height:46px}
.toolbar .search input{padding:10px 0;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:16px 0 4px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:7px;flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chip .cn{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:400}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .cn{color:inherit;opacity:.7}
.active-f{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.af{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 6px 4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.af svg{width:14px;height:14px}
.rescount{font-size:13px;color:var(--ink-3);margin:10px 0 8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.docs{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);position:relative}
.doc:last-child{border-bottom:0}
.doc:hover{background:var(--sunk)}
.doc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.doc-type{grid-column:1 / -1;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--c);letter-spacing:.01em}
.doc-title{font-weight:500;font-size:15px;line-height:1.4;min-width:0}
.doc-title mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.doc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.doc-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

function applyFilters(skipType) {
  const f = S.f; let a = S.data.docs;
  if (!skipType && f.type !== 'all') a = a.filter(d => d.type === f.type);
  if (f.y1) a = a.filter(d => d.year >= +f.y1);
  if (f.y2) a = a.filter(d => d.year <= +f.y2);
  if (f.area) a = a.filter(d => d.area === f.area);
  if (f.to) { const t = norm(f.to); a = a.filter(d => norm(d.to).includes(t)); }
  if (f.st) a = a.filter(d => d.status === f.st);
  if (f.pdf) a = a.filter(d => d.pdf);
  if (f.file) a = a.filter(d => d.hasFile);
  for (const [k, v] of Object.entries(f.x || {})) if (v) a = a.filter(d => d.x && d.x[k] === v);

    if (S.sort === 'auto') sc.sort((x, y) => y[1] - x[1] || String(y[0].date).localeCompare(String(x[0].date)));

  if (S.sort === 'old') a = a.slice().sort((x, y) => String(x.date).localeCompare(String(y.date)));
  if (S.sort === 'new') a = a.slice().sort((x, y) => String(y.date).localeCompare(String(x.date)));
  if (S.sort === 'title') a = a.slice().sort((x, y) => x.title.localeCompare(y.title, 'mn'));

}

async function offIndex(list) {
  OFF.busy = true;
  const docs = offNeeded(); const byDoc = {};
  const files = list.filter(x => /\.pdf$/i.test(x.file.name));
  // 1. exact content (size + SHA-256)
  const bySize = {}; files.forEach(x => { (bySize[x.file.size] = bySize[x.file.size] || []).push(x); });
  const shaCache = new Map();
  const shaOf = async x => { if (!shaCache.has(x)) shaCache.set(x, await sha256(x.file)); return shaCache.get(x); };
  for (const d of docs) {
    if (!d.pdfSize) continue;
    const cands = bySize[d.pdfSize] || []; if (!cands.length) continue;
    if (d.pdfSha) { for (const x of cands) { if (await shaOf(x) === d.pdfSha) { byDoc[d.id] = x.file; break; } } }
    else if (cands.length === 1) byDoc[d.id] = cands[0].file;
    else {
      const nm = d.pdfName ? d.pdfName.split('/').pop() : '';
      let hit = nm ? cands.find(x => x.file.name === nm) : null;
      if (!hit) { const sc = cands.map(x => [x, matchSig(fileSignals(x.path), [d])]).filter(z => z[1].id).sort((a, b) => b[1].sc - a[1].sc); if (sc.length && (sc.length === 1 || sc[0][1].sc > sc[1][1].sc)) hit = sc[0][0]; }
      if (!hit && new Set(cands.map(x => x.file.size + '|' + x.file.name)).size === 1) hit = cands[0];
      if (hit) byDoc[d.id] = hit.file;
    }
  }
  // 2. original file name, when recorded
  const byName = {}; files.forEach(x => { (byName[x.file.name] = byName[x.file.name] || []).push(x); });
  for (const d of docs) {
    if (byDoc[d.id] || !d.pdfName) continue;
    const tail = d.pdfName.split('/').slice(-2).join('/'); const nm = d.pdfName.split('/').pop();
    const c = (byName[nm] || []); const hit = c.find(x => x.path.endsWith(tail)) || (c.length === 1 ? c[0] : null);
    if (hit) byDoc[d.id] = hit.file;
  }
  // 3. the same file name matcher the online linker uses
  const left = docs.filter(d => !byDoc[d.id]);

    const used = new Set(Object.values(byDoc));
    const pools = {};
    for (const x of files) {
      if (used.has(x.file)) continue;
      const type = typeFromPath(x.path);
      const pool = (pools[type || '*'] = pools[type || '*'] || left.filter(d => !type || d.type === type));
      if (!pool.length) continue;
      const m = matchSig(fileSignals(x.path), pool);

    }

}

/* ---------- GitHub edition: admins sign in with a token and save straight to the repository ---------- */
const GH = {
  cfg: { owner: '', repo: '', branch: 'main' }, token: '', user: '', headSha: '', dataSha: '', staged: new Map(),
  init() {
    const c = Object.assign({ owner: '', repo: '', branch: 'main' }, GHCFG || {});
    const h = location.hostname.toLowerCase();
    if (/\.github\.io$/.test(h)) {
      c.owner = h.replace(/\.github\.io$/, '');
      const seg = decodeURIComponent(location.pathname.split('/').filter(Boolean)[0] || '');
      c.repo = seg && !/\.[a-z0-9]+$/i.test(seg) ? seg : h;
    }
    this.cfg = c;
  },
  saved() { try { return localStorage.getItem('heuk.gh.token') || sessionStorage.getItem('heuk.gh.token') || ''; } catch (e) { return ''; } },
  keep(token, remember) {
    try { localStorage.removeItem('heuk.gh.token'); sessionStorage.removeItem('heuk.gh.token'); if (token) (remember ? localStorage : sessionStorage).setItem('heuk.gh.token', token); }
    catch (e) { /* storage unavailable: the token lives only in this page */ }
  },
  repoUrl() { return `https://github.com/${this.cfg.owner}/${this.cfg.repo}`; },
  async api(path, o = {}) {
    const url = /^https:/.test(path) ? path : `https://api.github.com/repos/${encodeURIComponent(this.cfg.owner)}/${encodeURIComponent(this.cfg.repo)}${path}`;
    const headers = { Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
    if (this.token && !o.anon) headers.Authorization = `Bearer ${this.token}`;
    if (o.body) headers['Content-Type'] = 'application/json';
    const body = o.body ? JSON.stringify(o.body) : undefined;
    for (let i = 0; ; i++) {
      let r;
      try { r = await fetch(url, { method: o.method || 'GET', headers, body, cache: 'no-store' }); }
      catch (e) { if (i < 2 && !o.once) { await sleep(1500 * (i + 1)); continue; } throw Object.assign(new Error('network'), { code: 'network' }); }
      if (r.ok) return o.raw ? r.text() : r.status === 204 ? null : r.json();
      let info = null; try { info = await r.json(); } catch (e) { /* no body */ }
      const msg = String((info && info.message) || '');
      const limited = r.status === 429 || (r.status === 403 && (/rate limit/i.test(msg) || r.headers.get('retry-after')));
      if ((limited || r.status >= 500) && i < 4 && !o.once) { await sleep(((+r.headers.get('retry-after')) || 4 * (i + 1)) * 1000); continue; }
      const code = r.status === 401 ? 'bad_token' : (r.status === 403 || r.status === 404) ? 'no_access' : r.status === 409 ? 'conflict' : r.status === 422 ? 'invalid' : 'github';
      throw Object.assign(new Error(`GitHub ${r.status} ${msg}`), { code, status: r.status, info });
    }
  },
  async login(token, name) {
    this.token = String(token || '').trim();
    try {
      if (!this.token) throw Object.assign(new Error('empty'), { code: 'bad_token' });
      const repo = await this.api('');
      if (!repo.permissions || !repo.permissions.push) throw Object.assign(new Error('read only'), { code: 'no_push' });
      if (repo.default_branch) this.cfg.branch = repo.default_branch;
    } catch (e) { this.token = ''; throw e; }
    if (name) { this.user = name; return; }
    try { this.user = (await this.api('https://api.github.com/user')).login || ''; } catch (e) { this.user = ''; }
  },
  async head() {
    const ref = await this.api(`/git/ref/heads/${encodeURIComponent(this.cfg.branch)}`);
    const commit = ref.object.sha;
    const c = await this.api(`/git/commits/${commit}`);
    const t = await this.api(`/git/trees/${c.tree.sha}`);
    const ent = n => (t.tree || []).find(e => e.path === n) || {};
    return { commit, tree: c.tree.sha, dataSha: ent('data.json').sha || '', pdfTree: ent('pdf').sha || '' };
  },
  async loadData() {
    const h = await this.head();
    if (!h.dataSha) throw Object.assign(new Error('data.json missing'), { code: 'github' });
    const data = JSON.parse(await this.api(`/git/blobs/${h.dataSha}`, { raw: true }));
    this.headSha = h.commit; this.dataSha = h.dataSha;
    return data;
  },
  b64(file) {
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const s = String(fr.result); res(s.slice(s.indexOf(',') + 1)); }; fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
  },
  async blob(x) {

  },
  async commit(message, force) {

      let have = null;
      if (entries.some(([, sha]) => sha === null)) {

/* ---------- admin accounts ----------
   admins.json holds the GitHub key encrypted with a random site key K (AES-GCM).
   Each admin entry holds K encrypted with a key derived from that admin's password (PBKDF2-SHA256),
   so a name and password unlock K, and K unlocks the GitHub key. Names are stored only as a hash
   and, readable, inside a box sealed with K. */
const AUTH = {
  FILE: 'admins.json', ITER: 600000, MIN: 10, SKEY: 'heuk.admin',
  me: null, raw: null, key: null, doc: null, list: [],

  err(code) { return Object.assign(new Error(code), { code }); },

    for (const [p, f] of [...S.pending]) { const sha = await GH.blob(f); if (S.pending.get(p) === f) { S.pending.delete(p); GH.staged.set(p, sha); } }
    for (const p of [...S.pendingDel]) { GH.staged.set(p, null); S.pendingDel.delete(p); }

      openTokenLogin('Нэвтрэх түлхүүрийн хугацаа дууссан эсвэл хүчингүй болсон байна. Шинэ түлхүүр оруулбал хадгалаагүй өөрчлөлт хадгалагдана.'); return;

}

  if (c === 'no_push' || c === 'no_access') return 'Энэ түлхүүрээр репод бичих эрх алга';
  if (c === 'conflict') return 'Өөр админ зэрэг өөрчлөлт хийсэн байна. Дахин оролдоно уу';

    catch (e) { if (e && e.code === 'too_large') { toast('PDF файл 16 МБ-аас их байна'); return false; } }

/* ---------- Excel and downloads ---------- */
let xlsxP = null;
function getXLSX() {
  if (!xlsxP) {
    const cdn = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    const from = src => loadScript(src).then(() => { if (!window.XLSX) throw new Error('xlsx missing'); return window.XLSX; });
    xlsxP = GHM ? from('lib/xlsx.full.min.js').catch(() => from(cdn)) : from(cdn);
    xlsxP.catch(() => { xlsxP = null; });
  }
  return xlsxP;
}
async function offer(filename, data) {
  const dl = await cap('downloads');
  if (!dl) {
    if (!window.claude) { try { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return; } catch (e) { /* fall through */ } }
    toast('Энэ орчинд файл татах боломжгүй байна'); return;
  }
  try { await dl.save({ filename, data }); }
  catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('Өмнөх татах цонх нээлттэй байна'); return; } toast('Файлыг татаж чадсангүй'); }
}

  if (kindOf(d.type) === 'law') { r['Төслийн тоо'] = projOf(d); r['Өгсөн саналын тоо'] = d.proposals || 0; if (d.accepted != null && d.accepted !== '') r['Тусгагдсан санал'] = d.accepted; }

  if (d.pdf) r['PDF'] = d.pdf;

}

      <div class="mpick">${r.type ? `<input class="inp" list="bpl-${r.type}" data-bp="${i}" value="${esc(d ? maps[r.type].back[d.id] || '' : '')}" placeholder="Баримтыг дугаар, огноо, гарчгаар хайж сонгох" aria-label="Холбох баримт" ${BP.busy ? 'disabled' : ''}>${d && d.pdf && !BP.opts.over && !r.st ? '<small>Энэ баримт аль хэдийн PDF-тэй тул алгасна</small>' : ''}` : '<span class="pair-note">Дээрх Ангилал талбараас ангиллыг сонгоод дахин сонгоно уу</span>'}</div>
      <div>${stTxt}</div></div>`;
  }
  const lists = typesIn.map(k => `<datalist id="bpl-${k}">${[...maps[k].m.keys()].map(l => `<option value="${esc(l)}">`).join('')}</datalist>`).join('');
  sheet('PDF бөөнөөр холбох', `
    <div class="bp-sum">
      <span class="pill ok">${ic('ok', 13)}Итгэлтэй ${cnt.ok}</span><span class="pill warn">${ic('half', 13)}Шалгах ${cnt.check}</span>${cnt.manual ? `<span class="pill info">${ic('reply', 13)}Гараар ${cnt.manual}</span>` : ''}<span class="pill bad">${ic('bad', 13)}Олдсонгүй ${cnt.none + cnt.dup}</span>
    </div>
    <p class="search-note" style="margin:0">${nf(rows.length)} PDF файл${BP.skippedNonPdf ? `, ${BP.skippedNonPdf} PDF биш файлыг тооцоогүй` : ''}. "Шалгах" болон "Олдсонгүй" гэсэн мөрүүд эхэнд байна. Талбарт дугаар эсвэл гарчгийн хэсгийг бичээд жагсаалтаас зөв баримтыг сонгоно. Холбохгүй бол талбарыг хоосон үлдээнэ.</p>
    ${BP.busy || BP.done ? `<div class="progress"><i id="bpBar" style="width:${BP.prog || 0}%"></i></div><p class="search-note" id="bpMsg" style="margin:0">${esc(BP.msg || '')}</p>` : ''}
    <div id="bpRows">${html}</div>${lists}`,
    `<button class="btn ghost" data-act="bp-reset" ${BP.busy ? 'disabled' : ''}>Өөр хавтас сонгох</button><span style="flex:1"></span><button class="btn ghost" data-act="close-layer">Хаах</button><button class="btn primary" data-act="bp-go" id="bpGo" ${linkable && !BP.busy ? '' : 'disabled'}>${BP.busy ? 'Холбож байна' : `${nf(linkable)} PDF холбох`}</button>`, true);
  $('#bpRows').addEventListener('change', e => {
    const inp = e.target.closest('[data-bp]'); if (!inp) return;
    const r = BP.rows[+inp.dataset.bp]; const v = inp.value.trim();
    if (!v) { r.id = ''; r.conf = 'none'; }
    else { const id = BP.maps[r.type] && BP.maps[r.type].m.get(v); if (!id) { toast('Жагсаалтаас баримтыг сонгоно уу'); return; } const other = BP.rows.find(x => x !== r && x.id === id); if (other) { other.id = ''; other.conf = 'dup'; } r.id = id; r.conf = 'manual'; }
    const keep = $('.sheet-b') ? $('.sheet-b').scrollTop : 0; bpRender(); const sb = $('.sheet-b'); if (sb) sb.scrollTop = keep;
  });
}
async function uploadRetry(assets, file) {
  for (let i = 0; ; i++) {
    try { return await assets.upload(file, { type: 'application/pdf' }); }
    catch (e) { const c = e && e.code; if ((c === 'rate_limited' || c === 'upstream_error') && i < 3) { await new Promise(r => setTimeout(r, 2500 * (i + 1) + Math.random() * 1000)); continue; } throw e; }
  }
}
async function bpUpload() {
  if (BP.busy) return;
  const assets = GHM ? null : await cap('assets');
  if (!assets && !(GHM && S.admin)) { toast('Энэ орчинд PDF хадгалах боломжгүй. Аппыг засварлах эрхтэйгээр нээнэ үү.'); return; }
  const jobs = BP.rows.filter(r => r.id && !r.st && (BP.opts.over || !findDoc(r.id).pdf));
  BP.rows.filter(r => r.id && !r.st && !jobs.includes(r)).forEach(r => { r.st = 'skip'; });
  const total = jobs.length; if (!total) return;
  BP.busy = true; BP.done = false; BP.prog = 0; BP.msg = `0 / ${total}`; let n = 0, ok = 0, fails = 0, sinceSave = 0;
  bpRender();
  const tick = () => { BP.prog = Math.round(n / total * 100); BP.msg = `${n} / ${total} файл боловсруулсан${fails ? `, ${fails} алдаатай` : ''}`; const b = $('#bpBar'), m = $('#bpMsg'); if (b) b.style.width = BP.prog + '%'; if (m) m.textContent = BP.msg; };
  const worker = async () => {
    while (jobs.length) {
      const r = jobs.shift(); const d = findDoc(r.id);
      try {
        if (GHM) {
          const path = `pdf/${d.id}.pdf`;
          const sha = await GH.blob(r.file);
          if (d.pdf && d.pdf !== path) dropPdf(d);
          S.pendingDel.delete(path); S.pending.delete(path); GH.staged.set(path, sha);
          if (S.blob[path]) URL.revokeObjectURL(S.blob[path]);
          d.pdf = path; S.blob[path] = URL.createObjectURL(r.file); d.hasFile = true; await stampPdf(d, r.file, r.path); r.st = 'done'; ok++; sinceSave++;
        } else {
        const res = await uploadRetry(assets, r.file);
        const old = d.pdf && String(d.pdf).startsWith('/_blob/') ? d.pdf.slice(7) : '';
        d.pdf = '/_blob/' + res.id; S.blob[d.pdf] = res.url; d.hasFile = true; await stampPdf(d, r.file, r.path); r.st = 'done'; ok++; sinceSave++;
        if (old && old !== res.id) { try { await assets.delete(old); } catch (e) { /* old file stays */ } }
        }
      } catch (e) { r.st = 'fail'; r.err = e && e.code; fails++; }
      n++; tick();
      if (sinceSave >= 60) { sinceSave = 0; saveNow(); }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  BP.busy = false; BP.done = true;
  BP.msg = `${ok} PDF холбогдлоо${fails ? `. ${fails} файл алдаатай тул холбогдсонгүй, ${GHM ? 'интернэт холболтоо шалгаад дахин оролдоно уу' : 'хэмжээ нь 20 МБ-аас их эсэхийг шалгана уу'}` : ''}.`;
  BP.prog = 100;
  setSave('dirty'); await saveNow();
  if ($('#bpRows')) bpRender();
  render(); toast(`${ok} PDF холбогдлоо`);
}

/* ---------- Excel import ---------- */
const HDR = {
  type: ['төрөл', 'баримтын төрөл'], no: ['дугаар', '№', 'баримтын дугаар'], date: ['огноо', 'хүргүүлсэн огноо', 'date'], year: ['он'],
  title: ['агуулга', 'гарчиг', 'нэр', 'баримтын нэр', 'гарчиг, агуулга', 'хуулийн төслийн нэр', 'судалгааны нэр', 'дүн шинжилгээ'],
  to: ['хэнд', 'хүлээн авагч', 'хүргүүлсэн', 'хүргүүлсэн байгууллага', 'хаана'],
  area: ['сэдэв', 'эрхийн чиглэл', 'чиглэл'], status: ['төлөв', 'хэрэгжилт', 'хэрэгжилтийн байдал'], summary: ['товч агуулга', 'агуулга, авсан арга хэмжээ'],
  projects: ['төслийн тоо', 'хуулийн төсөл (тоо)'], proposals: ['өгсөн саналын тоо', 'өгсөн санал', 'саналын тоо', 'төсөлд өгсөн санал (тоо)'], accepted: ['тусгагдсан санал', 'туссан санал'],
  file: ['файл'], pdf: ['pdf', 'холбоос'], skip: ['д/д', 'сар', 'онсар', '_мөр (туслах)', '_хайлт (туслах)']
};
const VIEW_SHEET = /хайлт|самбар|нэгтгэл|пивот|дата|тооцоо|түлхүүр|нөөц|хяналт|санхүүжилт|илтгэл/i;
function mapHeaders(keys) { const m = {}; for (const k of keys) { const n = norm(k).trim(); for (const [f, syn] of Object.entries(HDR)) if (!m[f] && syn.includes(n)) { m[f] = k; break; } } return m; }
function parseDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number') { if (v > 1800 && v < 2200) return `${v}-01-01`; const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v); let m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m = s.match(/(\d{4})/); return m ? `${m[1]}-01-01` : '';
}
function findStatus(type, label) { const n = norm(label).trim(); const list = stList(type); const dflt = (list.find(x => x[0] === 'unk') || list.find(x => x[0] === 'pending') || list[0] || ['na'])[0]; if (!n) return dflt; const all = list.concat(ST.doc, ST.law, ST.pub).filter(x => x[1]); const hit = all.find(([, l]) => norm(l) === n) || all.find(([, l]) => norm(l).startsWith(n) || n.startsWith(norm(l))); return hit ? hit[0] : dflt; }
function findType(label) { const n = norm(label).trim(); if (!n) return null; const t = types().find(t => norm(t.label) === n || norm(t.short) === n) || types().find(t => n.startsWith(norm(t.short))); return t ? t.key : null; }
$('#xlsIn').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  toast('Файлыг уншиж байна');
  try {
    const XLSX = await getXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: false });
    const seen = new Set(S.data.docs.map(d => `${d.type}|${d.year}|${norm(d.no)}|${norm(d.title)}`));
    const add = [], used = [], ignored = []; let skipped = 0, dup = 0;
    const meta = (wb.Workbook && wb.Workbook.Sheets) || [];
    wb.SheetNames.forEach((sn, si) => {
      if ((meta[si] && meta[si].Hidden) || VIEW_SHEET.test(sn)) { ignored.push(sn); return; }
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' }); if (!rows.length) { ignored.push(sn); return; }
      const keys = Object.keys(rows[0]); const m = mapHeaders(keys); if (!m.title) { ignored.push(sn); return; }
      const mapped = new Set(Object.values(m));
      const sheetType = findType(sn); let n = 0;
      for (const r of rows) {
        const title = String(r[m.title] || '').trim(); if (!title) continue;
        const type = (m.type && findType(r[m.type])) || sheetType; if (!type) { skipped++; continue; }
        let date = parseDate(m.date ? r[m.date] : ''); if (!date && m.year) date = parseDate(r[m.year]); if (!date) { skipped++; continue; }
        const year = m.year && /^\d{4}$/.test(String(r[m.year]).trim()) ? +String(r[m.year]).trim() : +date.slice(0, 4);
        const d = { id: `${type}-${year}-${uid()}`, type, date, year, no: String(m.no ? r[m.no] : '').trim(), title, to: m.to ? String(r[m.to]).trim() : '', area: m.area ? String(r[m.area]).trim() : '', x: {} };
        if (m.summary && String(r[m.summary]).trim()) d.summary = String(r[m.summary]).trim();
        if (kindOf(type) === 'law') { d.projects = +(m.projects ? r[m.projects] : 1) || 1; d.proposals = +(m.proposals ? r[m.proposals] : 0) || 0; if (m.accepted && String(r[m.accepted]).trim() !== '') d.accepted = +r[m.accepted] || 0; }
        if (m.file) { const fv = norm(r[m.file]).trim(); d.hasFile = ['тийм', 'байгаа', 'yes'].includes(fv); }
        if (m.pdf && r[m.pdf]) d.pdf = String(r[m.pdf]).trim();
        for (const k of keys) { if (mapped.has(k) || HDR.skip.includes(norm(k).trim()) || /^__EMPTY/.test(k)) continue; const val = String(r[k] ?? '').trim(); if (val) d.x[k] = val; }
        if (m.status) d.status = findStatus(type, r[m.status]);
        else if (stList(type).some(x => x[0] === 'reply')) d.status = noteStatus(d.x['Тайлбар']);
        else d.status = findStatus(type, '');
        applyRules(d);
        const key = `${d.type}|${d.year}|${norm(d.no)}|${norm(d.title)}`;
        if (seen.has(key)) { dup++; continue; }
        seen.add(key); add.push(d); n++;
      }
      used.push(`${sn} (${n})`);
    });
    const byT = {}; add.forEach(d => byT[d.type] = (byT[d.type] || 0) + 1);
    sheet('Excel-ээс оруулах', `<p class="note">${esc(file.name)} файлаас ${nf(add.length)} шинэ баримт уншлаа.${dup ? ` ${nf(dup)} баримт аль хэдийн бүртгэлтэй тул давхар оруулахгүй.` : ''}${skipped ? ` ${skipped} мөрийг төрөл эсвэл огноо дутуу тул алгаслаа.` : ''}</p>
      <div class="slist">${Object.entries(byT).map(([k, n]) => `<div class="sitem"><span class="dotc" style="--c:${tColor(k)}"></span><span class="lab">${esc(tOf(k).label)}</span><span class="n">${n}</span></div>`).join('') || '<p class="empty">Нэмэх шинэ мөр олдсонгүй.</p>'}</div>
      ${ignored.length ? `<p class="search-note">Туслах болон тооцооны хуудсыг оруулаагүй: ${esc(ignored.join(', '))}.</p>` : ''}
      ${S.data.meta.sample ? `<label class="check"><input type="checkbox" id="impRepl">Жишээ өгөгдлийг устгаж, зөвхөн энэ файлын мэдээллийг үлдээх</label>` : ''}`,
      `<button class="btn ghost" data-act="close-layer">Болих</button><button class="btn primary" id="impGo" ${add.length ? '' : 'disabled'}>${nf(add.length)} баримт нэмэх</button>`);
    const go2 = $('#impGo'); if (go2) go2.onclick = () => {
      const repl = $('#impRepl') && $('#impRepl').checked;
      if (repl) { S.data.docs = []; S.data.comps = []; S.data.meta.sample = false; }
      S.data.docs.push(...add);
      add.forEach(d => { if (d.area && !S.data.areas.includes(d.area)) S.data.areas.push(d.area); });
      closeLayer(); changed(); render(); toast(`${nf(add.length)} баримт нэмэгдлээ`);
    };
  } catch (err) { toast('Excel файлыг уншиж чадсангүй'); }
});

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.dataset.act === 'scrim') { fn(a, e); return; }
  e.preventDefault(); fn(a, e);
});
document.addEventListener('change', e => {
  const b = e.target.dataset && e.target.dataset.bind;
  if (b === 'dashYear') { S.dashYear = e.target.value; render(); }
  if (b === 'sort') { S.sort = e.target.value; renderDocsDyn(); }
});
let qT = 0;
document.addEventListener('input', e => {
  if (e.target.id === 'docQ') { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { S.f.q = v; S.limit = 40; renderDocsDyn(); }, 120); }
});
document.addEventListener('focusout', e => { if (e.target.id === 'docQ') rememberQ(e.target.value); });
$('#main').addEventListener('click', e => {
  const h = e.target.closest('.hit'); if (!h) return;

document.addEventListener('keydown', e => {

  if (!typing && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) { e.preventDefault(); openPalette(); }
});
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.view === 'dash') drawCharts(); }, 150); });

/* ---------- boot ---------- */
$('#offDir').addEventListener('change', e => { const fl = [...e.target.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name })); toast('Хавтсыг уншиж байна'); OFF.busy = true; setTimeout(() => offIndex(fl), 20); });
renderNav();
const BOOT = (async () => {
  try {
    if (STANDALONE) S.data = JSON.parse(document.getElementById('heuk-data').textContent);
    else if (LOCAL) { await loadScript('data.js').catch(() => {}); if (!window.HEUK_DATA) throw new Error('data.js missing'); S.data = window.HEUK_DATA; }
    else { const r = await fetch('data.json', { cache: 'no-cache' }); if (!r.ok) throw new Error('HTTP ' + r.status); S.data = await r.json(); }
    prep();
    const h = (location.hash || '').slice(1);
    if (h && findComp(h)) { S.view = 'comp'; S.compId = h; }
    render();
    if (h && findDoc(h)) openReader('doc', h);
  } catch (e) {
    if (LOCAL) { const u = `https://${GH.cfg.owner}.github.io/${GH.cfg.repo}/`; $('#main').innerHTML = `<div class="panel empty"><b>Мэдээллийн файл олдсонгүй</b>index.html файлыг татаж авсан хавтасны дотроос нээнэ үү. ZIP файлын дотроос шууд нээсэн бол эхлээд ZIP файлыг задлаад (Extract All), задалсан хавтасны index.html файлыг нээнэ. Хавтсанд data.js файл болон pdf хавтас байх ёстой. Онлайн хувилбар <a href="${u}" style="color:var(--accent)">${u}</a> хаягаар нээгдэнэ.</div>`; return; }
    $('#main').innerHTML = `<div class="panel empty"><b>Мэдээллийг ачаалж чадсангүй</b>Хуудсыг дахин ачаалж үзнэ үү.</div>`;
  }
})();
(async () => {
  if (GHM) { if (!LOCAL) ghBoot(); return; }
  const [u, as] = await Promise.all([cap('user'), cap('assets')]);
  let can = false;
  try { can = u ? !!(await u.canEdit()) : false; } catch (e) { can = false; }
  if (!can && as) can = true;
  if (can) { S.admin = true; if (S.data) render(); else renderNav(); }
})();
})();
